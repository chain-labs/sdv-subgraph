specVersion: 1.0.0
indexerHints:
  prune: auto
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum
    name: SDVMembership
    network: base
    source:
      address: "0x1190442f6b7505d3edc30c59e5B99EBfdEeF34e9"
      abi: SDVMembership
      startBlock: 16526077
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - Member
        - SDVVVMembership
        - TrustedEntity
        - DefaultAdmin
        - Membership
      abis:
        - name: SDVMembership
          file: ./abis/SDVMembership.json
      eventHandlers:
        - event: BaseUriUpdated(string)
          handler: handleBaseUriUpdated
        - event: UriSuffixUpdated(string)
          handler: handleUriSuffixUpdated
        - event: TierUpdated(indexed uint256,indexed uint256)
          handler: handleTierUpdated
        - event: RoleGranted(indexed bytes32,indexed address,indexed address)
          handler: handleRoleGranted
        - event: RoleRevoked(indexed bytes32,indexed address,indexed address)
          handler: handleRoleRevoked
        - event: Transfer(indexed address,indexed address,indexed uint256)
          handler: handleTransfer
      file: ./src/sdv-membership.ts
  - kind: ethereum
    name: SDVPerksRegistry
    network: base
    source:
      address: "0xCbeB4D1A275F3c8c6095EbD4a503AFD77228Bb4e"
      abi: SDVPerksRegistry
      startBlock: 16526077
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - PerksRegistry
        - Perk
        - SDVVVMembershhip
      abis:
        - name: SDVPerksRegistry
          file: ./abis/SDVPerksRegistry.json
      eventHandlers:
        - event: PerkDeactivated(uint256,address)
          handler: handlePerkDeactivated
        - event: PerkReactivated(uint256,address)
          handler: handlePerkReactivated
        - event: PerkUriUpdated(indexed uint256,string)
          handler: handlePerkUriUpdated
        - event: PerkEligibilityUpdated(indexed uint256,uint256[],uint256[])
          handler: handlePerkEligibilityUpdated
        - event: PerkRegistered(indexed uint256,string,string)
          handler: handlePerkRegistered
        - event: RoleGranted(indexed bytes32,indexed address,indexed address)
          handler: handleRoleGranted
      file: ./src/sdv-perks-registry.ts
