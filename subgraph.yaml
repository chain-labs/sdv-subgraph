specVersion: 1.0.0
indexerHints:
  prune: auto
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum
    name: SDVMembership
    network: base-sepolia
    source:
      address: "0xb41326531b5ab5dfEB0880DB37754568a0bF1AB7"
      abi: SDVMembership
      startBlock: 10525475
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - Approval
        - ApprovalForAll
        - EIP712DomainChanged
        - RoleAdminChanged
        - RoleGranted
        - RoleRevoked
        - Transfer
      abis:
        - name: SDVMembership
          file: ./abis/SDVMembership.json
      eventHandlers:
        - event: Approval(indexed address,indexed address,indexed uint256)
          handler: handleApproval
        - event: ApprovalForAll(indexed address,indexed address,bool)
          handler: handleApprovalForAll
        - event: EIP712DomainChanged()
          handler: handleEIP712DomainChanged
        - event: RoleAdminChanged(indexed bytes32,indexed bytes32,indexed bytes32)
          handler: handleRoleAdminChanged
        - event: RoleGranted(indexed bytes32,indexed address,indexed address)
          handler: handleRoleGranted
        - event: RoleRevoked(indexed bytes32,indexed address,indexed address)
          handler: handleRoleRevoked
        - event: Transfer(indexed address,indexed address,indexed uint256)
          handler: handleTransfer
      file: ./src/sdv-membership.ts
  - kind: ethereum
    name: SDVPerksRegistry
    network: base-sepolia
    source:
      address: "0x456b9ef1A9e08609DAd2E2771214b16ad8a8a176"
      abi: SDVPerksRegistry
      startBlock: 10525575
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - PerkDeactivated
        - PerkEligibilityUpdated
        - PerkRegistered
        - SDVPerksRegistryRoleAdminChanged
        - SDVPerksRegistryRoleGranted
        - SDVPerksRegistryRoleRevoked
      abis:
        - name: SDVPerksRegistry
          file: ./abis/SDVPerksRegistry.json
      eventHandlers:
        - event: PerkDeactivated(uint256,address)
          handler: handlePerkDeactivated
        - event: PerkEligibilityUpdated(indexed uint256,uint256[],uint256[])
          handler: handlePerkEligibilityUpdated
        - event: PerkRegistered(indexed uint256,string,string)
          handler: handlePerkRegistered
        - event: RoleAdminChanged(indexed bytes32,indexed bytes32,indexed bytes32)
          handler: handleRoleAdminChanged
        - event: RoleGranted(indexed bytes32,indexed address,indexed address)
          handler: handleRoleGranted
        - event: RoleRevoked(indexed bytes32,indexed address,indexed address)
          handler: handleRoleRevoked
      file: ./src/sdv-perks-registry.ts
